name: Feature request
description: Propose a generic presentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Proposals must preserve the Frame, Skin, and Plugin responsibility boundaries described in ARCHITECTURE.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
        - label: This proposal is generic presentation behavior rather than site-specific or plugin functionality.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected behavior without assuming an implementation.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note affected hooks, templates, Skins, plugins, or saved content.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
